{% extends "base.html" %}

{% block content %}
<div class="wallet-container">
    <h2>Minha Carteira</h2>
    
    <div class="wallet-balance">
        <i class="fas fa-wallet"></i>
        <span>Saldo: R$ {{ "%.2f"|format(session.get('wallet', 0)|float) }}</span>
    </div>
    
    <div class="wallet-actions">
        <a href="{{ url_for('deposito') }}" class="action-button deposit">
            <i class="fas fa-plus-circle"></i>
            Depositar
        </a>
        <a href="{{ url_for('sacar') }}" class="action-button withdraw">
            <i class="fas fa-minus-circle"></i>
            Sacar
        </a>
    </div>
</div>

<style>
.wallet-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.wallet-container h2 {
    color: white;
    text-align: center;
    margin-bottom: 30px;
}

.wallet-balance {
    background: #1f2937;
    padding: 25px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
    justify-content: center;
}

.wallet-balance i {
    color: #10b981;
    font-size: 28px;
}

.wallet-balance span {
    font-size: 24px;
    font-weight: 500;
    color: white;
}

.wallet-actions {
    display: flex;
    gap: 20px;
    justify-content: center;
}

.action-button {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 30px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    transition: transform 0.2s, opacity 0.2s;
}

.action-button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.action-button.deposit {
    background: #10b981;
    color: white;
}

.action-button.withdraw {
    background: #ef4444;
    color: white;
}

.action-button i {
    font-size: 20px;
}
</style>
{% endblock %}
